[workspace]
resolver = "2"
members = ["crates/kiry-core", "crates/kiry"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
debug = "line-tables-only"     # enough for backtraces, far less to emit and link

[profile.dev.package."*"]
opt-level = 2                  # deps optimized once; the tests hash and extract, which crawl at 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
